<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- CSP copied from console/main (keep the 127.0.0.1:4801 spelling — localhost breaks in-page fetches, HARDENING audit) -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://api.fontshare.com; font-src https://fonts.gstatic.com https://cdn.fontshare.com; img-src 'self' data:; connect-src 'self' http://127.0.0.1:3001 http://localhost:3001 http://127.0.0.1:4801 http://127.0.0.1:4809 http://127.0.0.1:4810 http://127.0.0.1:4880 http://127.0.0.1:3022 http://127.0.0.1:54321 http://127.0.0.1:54322 https://coljlubmewcpgjzqapyl.supabase.co https://conifer-billing-production.up.railway.app https://conifer-gateway-production.up.railway.app https://status.conifer.build; base-uri 'none'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conifer Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Spline+Sans+Mono:ital,wght@0,400..600;1,400..500&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#090909; --panel:#121212; --raise:#1B1B1B; --line:#303030; --line2:#252525;
  --ink:#F4F4F4; --sec:#D0D0D0; --dim:#ADADAD; --faint:#959595;
  --grid:rgba(255,255,255,.07);
  /* the landing cue (anchor-flash/anchor-fade): a lit edge and a ring that fade back */
  --cue-edge:#8A8A8A;--cue-ring:rgba(255,255,255,.16);--cue-ring-w:2px;--cue-ring-strong:rgba(255,255,255,.28);--cue-ring-w-strong:3px;--cue-shadow:0 1px 2px rgba(0,0,0,.5);--cue-fade:1.1s;--cue-ease:ease-out;
  /* "cloud" is the console's light neutral (owner 2026-09-06: no tan anywhere
   * but the Flow sankey, which keeps its own FLOW_CLD below) */
  --loc:#6FA57C; --cld:#D0D0D0; --vio:#8B7EC8;
  --up:#7FB069; --dn:#D08770;
  --m-qwen14:#7FB069; --m-llama8:#A3C585; --m-qwen4:#5E8C61;
  --m-fable:#D08770; --m-sonnet:#E3A587; --m-gpt:#6FC2B4; --m-kimi:#D68FB8;
  --m-dsk:#7A9CD6; --m-glm:#9B8CD9; --m-mistral:#E8B268;
  /* rainbow spread across the rest of the catalog (owner 2026-09-05: "vary the
   * colour"), held at the calm saturation of the nine above (owner 2026-09-06:
   * "a little bit too bright") */
  --m-haiku:#D79660; --m-fable51:#C7796B; --m-opus:#C17B8A; --m-luna:#6FB5B8; --m-mini:#8BC69C; --m-oss:#76B28A;
  --m-kimi2:#C87EB7; --m-dsk2:#77B9CF; --m-grok:#D4C77D;
  --sans:'Instrument Sans',sans-serif; --mono:'Spline Sans Mono',ui-monospace,monospace;
  /* --gold is the neutral UI accent now (nav on-state, Mint, warm buttons) */
  --focus:#959595; --gold:#F4F4F4;
  --panel-gap:16px; --control-gap:8px; --touch-target:44px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{background:var(--ground)}
body{background-color:var(--ground);color:var(--ink);font-family:var(--sans);font-size:12.5px;line-height:1.5;
  -webkit-font-smoothing:antialiased;min-height:100vh;
  background-image:radial-gradient(rgba(255,255,255,.03) 1px,transparent 1.1px);
  background-size:22px 22px}
::selection{background:rgba(255,255,255,.18)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{display:block}
.mono,.readout{font-family:var(--mono);font-variant-numeric:tabular-nums}
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}

/* ---------------- sidebar ---------------- */
.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:20px 14px 14px;
  background:#0F0F0F;border-right:1px solid var(--line2)}
.brand{display:flex;align-items:center;gap:11px;padding:0 6px 16px}
.brand .mark{color:#E2E2E2;flex:none}
.brand .bar{width:1px;height:30px;background:var(--line);flex:none}
.brand .word{font-weight:600;font-size:18px;letter-spacing:-.02em;line-height:1}
.brand .word small{display:block;font-family:var(--mono);font-weight:400;font-size:9px;letter-spacing:.2em;color:var(--dim);margin-top:4px}
.proj{display:flex;align-items:center;gap:5px;margin:0 4px 30px;padding:7px 12px;border:1px solid var(--line);border-radius:10px;
  font-size:12px;color:var(--dim);background:rgba(20,20,20,.6)}
.proj b{color:var(--ink);font-weight:500}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);padding:16px 10px 7px;font-weight:500}
.nav a{position:relative;display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:9px;font-size:13px;color:var(--sec);
  transition:color .18s,background-color .18s}
.nav a svg{flex:none;opacity:.72;transition:opacity .18s}
.nav a:hover{color:var(--ink);background:rgba(255,255,255,.035)}
.nav a:hover svg{opacity:1}
.nav a:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.nav a:active{transform:translateY(1px)}
.nav a.on{color:var(--ink);background:var(--raise);box-shadow:inset 2px 0 0 var(--gold)}
.nav a.on svg{opacity:1;color:var(--gold)}
.nav a.dim{color:var(--faint)}
.nav a .n{margin-left:auto;font-size:9px;color:var(--faint);font-family:var(--mono)}
.railfoot{margin-top:auto;padding:14px 4px 0;border-top:1px solid var(--line2)}
.acct{display:flex;align-items:center;gap:10px;padding:0 4px 12px}
.ava{width:30px;height:30px;border-radius:50%;background:var(--raise);color:var(--ink);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex:none}
.acct .who{min-width:0}
.acct .who .em{font-size:11.5px;color:#D7D7D7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct .who .st{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-top:2px}
.keybtn{display:block;width:100%;text-align:center;border:1px solid var(--line);border-radius:9px;padding:7px 10px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--sec);background:rgba(29,29,29,.5);
  transition:border-color .18s,color .18s,background-color .18s}
.keybtn:hover{color:var(--ink);border-color:#555555;background:var(--raise)}
.keybtn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.keybtn:active{transform:translateY(1px)}
.arbig{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:4px}
.arfield{display:flex;flex-direction:column;gap:8px}
.arinput{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#0C0C0C}
.arinput .cur{font-family:var(--mono);font-size:12px;color:var(--dim)}
.inp.big{border:0;background:none;padding:0;font-size:14px;font-family:var(--mono);color:var(--ink);width:100%}
.inp.big:focus{outline:none}
.arinput:focus-within{border-color:var(--focus)}
.railbtns{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.railbtns .keybtn{padding:5px 8px;font-size:9.5px;border-radius:8px}
.keybtn.danger{color:#E06B4F;border-color:rgba(224,107,79,.45)}
.keybtn.danger:hover{color:#E8A18A;border-color:rgba(208,135,112,.65);background:rgba(208,135,112,.08)}
.acct .st .cli{display:inline-flex;align-items:center;gap:4px;margin-left:8px}
.raillinks{display:flex;align-items:center;gap:11px;padding:11px 4px 0;font-family:var(--mono);font-size:10px;color:var(--dim);white-space:nowrap}
.raillinks a{transition:color .15s}
.raillinks a:hover{color:var(--ink)}
.raillinks a:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.raillinks .cli{margin-left:auto;display:flex;align-items:center;gap:5px}
.dot{width:5px;height:5px;border-radius:50%;background:var(--up);box-shadow:0 0 6px rgba(127,176,105,.7);flex:none}

/* ---------------- main / topbar ---------------- */
.main{padding:24px 32px 80px;max-width:1300px;width:100%;margin:0 auto;min-width:0}
.top{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px}
.top>div{min-width:0;max-width:100%}
.top h1{font-weight:600;font-size:22px;letter-spacing:-.02em;line-height:1.15;overflow-wrap:anywhere}
.top .sum{margin-top:6px;font-family:var(--mono);font-size:10.5px;color:var(--dim)}
.top .sum b{color:var(--sec);font-weight:500}
.topact{display:flex;flex-wrap:wrap;align-items:center;gap:10px;flex:none}
.scope{display:flex;flex-wrap:wrap;max-width:100%;border:1px solid var(--line);border-radius:var(--radius-control);padding:2px;background:rgba(20,20,20,.7)}
.scope button{display:flex;max-width:100%;overflow-wrap:anywhere;align-items:center;gap:7px;padding:5px 13px;border-radius:var(--radius-control);font-size:12px;color:var(--dim);
  transition:color .18s,background-color .18s}
.scope button:hover{color:var(--ink)}
.scope button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.scope button:active{transform:translateY(1px)}
.scope button.on{color:var(--ink);background:#222222;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--gold) 45%,transparent)}
.scope button b{width:6px;height:6px;border-radius:50%;font-size:0;flex:none}
.scope button:nth-child(1) b{background:var(--loc)}
.scope button:nth-child(2) b{background:var(--gold)}
.getkey{display:inline-flex;align-items:center;gap:6px;background:#F4F4F4;color:#111111;border-radius:var(--radius-control);
  padding:7px 15px;font-size:12.5px;font-weight:600;letter-spacing:-.01em;border:1px solid var(--ink);
  transition:background-color .18s,transform .18s}
.getkey:hover{background:#FFFFFF}
.getkey:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.getkey:active{transform:translateY(1px)}
.tag-demo{border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--faint)}

/* ---------------- panels ---------------- */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--panel-gap)}
.company-area{margin-bottom:var(--panel-gap)}
.company-row,.company-join{display:flex;flex-wrap:wrap;align-items:center;gap:var(--control-gap)}
.company-row+.company-row,.company-join,.company-feedback{margin-top:var(--control-gap)}
.company-name{margin-right:auto;overflow-wrap:anywhere;min-width:0}
.company-join .inp{flex:1 1 20ch;min-width:0}
.company-feedback{color:var(--sec)}
.panel{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;min-width:0;--acc:var(--cld);
  box-shadow:0 1px 2px rgba(0,0,0,.5),0 4px 12px rgba(0,0,0,.35);
  transition:border-color .25s,box-shadow .25s,transform .25s cubic-bezier(.22,1,.36,1)}
/* owner 2026-09-06: no coloured top rule on any panel, in any view. --acc stays
 * only for things that are not rules (the Add-funds slider and its button). */
.panel::before{display:none!important}
.panel:hover{border-color:#3A3A3A;
  box-shadow:0 1px 2px rgba(0,0,0,.5),0 8px 22px rgba(0,0,0,.44)}
.panel.lift{cursor:default}
.panel.lift:hover{transform:translateY(-2px)}
/* anchor-click landing cue: a very faint two-second glow on the target panel
 * (owner 2026-08-10 — a short page may not scroll, so the click must still
 * visibly land). transform/opacity-free; reduced-motion users keep it since
 * it is a static fade, not movement. */
/* side-nav landing cue (owner 2026-09-01): the target panel's EDGE lightens
 * at once (anchor-flash, no transition), then fades back (anchor-fade). A
 * class swap, never an animation: an animation replaced the panel's own
 * rise fade-in (.in) and replayed it when the cue ended (owner 2026-09-07
 * r14: the Set up your router box vanished for a moment after a Get started
 * click). Border + ring only — nothing inside the panel moves or repaints. */
.panel.anchor-flash,section.anchor-flash,div.anchor-flash .panel:first-child{border-color:var(--cue-edge);box-shadow:var(--cue-shadow),0 0 0 var(--cue-ring-w) var(--cue-ring);transition:none}
.panel.anchor-fade,section.anchor-fade,div.anchor-fade .panel:first-child{transition:border-color var(--cue-fade) var(--cue-ease),box-shadow var(--cue-fade) var(--cue-ease)}
/* a button as the landing target (Get started → Add payment): a white ring, held, then the same fade (owner 2026-09-08: white, not green) */
.btn.anchor-flash{border-color:var(--ink);color:var(--ink);box-shadow:0 0 0 var(--cue-ring-w-strong) var(--cue-ring-strong);transition:none}
.btn.anchor-fade{transition:border-color var(--cue-fade) var(--cue-ease),box-shadow var(--cue-fade) var(--cue-ease),color var(--cue-fade) var(--cue-ease)}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:15px 18px 0}
.ph .t{font-size:14px;font-weight:600;letter-spacing:-.01em;color:var(--ink)}
.ph .t em{font-style:normal;font-family:var(--mono);font-weight:400;font-size:10px;color:var(--dim);margin-left:8px;letter-spacing:0}
.ph .r{font-family:var(--mono);font-size:10.5px;color:var(--dim);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ph .r b{color:var(--sec);font-weight:500}
.pb{padding:13px 18px 17px}
.in{animation:rise .55s cubic-bezier(.22,1,.36,1) both;animation-delay:var(--d,0ms)}
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}

/* type */
.money{font-weight:600;font-size:46px;letter-spacing:-.035em;line-height:1.05;font-feature-settings:'tnum'}
.money small{font-size:24px;font-weight:500;color:var(--dim);letter-spacing:-.02em}
.stat .l{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);font-weight:500}
.stat .v{font-weight:600;font-size:26px;letter-spacing:-.03em;margin-top:6px;font-feature-settings:'tnum'}
.stat .s{font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:5px}
.up{color:var(--up)}.dn{color:var(--dn)}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:var(--radius-control);padding:1px 8px;
  font-family:var(--mono);font-size:10px;color:var(--sec);white-space:nowrap}
.chip.gd{color:var(--up);border-color:rgba(127,176,105,.4)}
.chip.wr{color:var(--sec);border-color:rgba(208,208,208,.45)}
.chip.rd{color:var(--dn);border-color:rgba(208,135,112,.45)}
.wow{display:inline-flex;align-items:center;gap:5px;border-radius:var(--radius-control);padding:2px 10px;font-family:var(--mono);font-size:10.5px;font-weight:500}
.wow.bad{color:#E8A88F;background:rgba(208,135,112,.13);border:1px solid rgba(208,135,112,.35)}
.wow.good{color:#9CC487;background:rgba(127,176,105,.12);border:1px solid rgba(127,176,105,.32)}
.lg{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;color:var(--dim);white-space:nowrap}
.lg i{width:8px;height:8px;border-radius:2.5px;background:var(--c,#555);flex:none}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:var(--radius-control);padding:5px 14px;
  font-size:12px;color:var(--sec);background:rgba(29,29,29,.55);transition:border-color .18s,background-color .18s,color .18s}
.btn:hover{border-color:#555555;background:var(--raise);color:var(--ink)}
.btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.btn:active{transform:translateY(1px)}

/* tables */
.tblwrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:500;text-align:left;
  padding:6px 10px;white-space:nowrap;border-bottom:1px solid var(--line2)}
th.num,td.num{text-align:right}
td.num{font-family:var(--mono);font-size:11.5px}
/* user-chosen labels (key/project names, up to 64 chars): clamp so a long name never pushes the money columns off the panel; the title carries the whole thing */
td.lbl{max-width:260px;overflow:hidden;text-overflow:ellipsis}
th.sort{cursor:pointer;transition:color .18s}
th.sort:hover{color:var(--ink)}
th.sort:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
th.sort.on{color:var(--ink)}
th.sort.on::after{content:' ↓';color:var(--cld)}
th.sort.on.asc::after{content:' ↑'}
td{padding:8px 10px;border-top:1px solid var(--line2);color:#D4D4D4;white-space:nowrap}
tr.hv{transition:background-color .15s}
tr.hv:hover{background:rgba(255,255,255,.03)}
/* uptime view: the public-page link */
.upt-public{font-family:var(--mono);font-size:11px;color:var(--dim);text-decoration:none;border-bottom:1px solid var(--line2);white-space:nowrap}
.upt-public:hover{color:var(--ink);border-bottom-color:var(--sec)}
tr.sel td{background:rgba(255,255,255,.045)}
td .sub{color:var(--dim);font-size:10.5px}
.mid{display:inline-flex;align-items:center;gap:8px}
.mid i{width:8px;height:8px;border-radius:2.5px;background:var(--c);flex:none}
.mid .mname{font-family:var(--mono);font-size:11.5px;color:var(--ink)}
.meter{display:block;position:relative;height:4px;border-radius:2px;background:#292929;overflow:hidden}
.meter b{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--c,var(--cld))}
.bar-cell{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.bar-cell .meter{width:60px;flex:none}

/* charts shared */
.xaxis{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--dim);padding-top:7px}
.hoverline{transition:opacity .12s}

/* chart interactions */
#sank .ribbon{transition:opacity .18s;cursor:pointer}
#sank.focus .ribbon{opacity:.13}
#sank.focus .ribbon.on2{opacity:.85}
#sank.focus .redge{opacity:.12}
.tmcell rect{transition:opacity .15s}
.tmcell:hover rect{opacity:1}
.heat{display:grid;grid-template-columns:repeat(24,1fr);grid-auto-rows:1fr;gap:1.5px;height:206px}
.dheat{display:grid;grid-template-columns:repeat(auto-fill,13px);grid-auto-rows:13px;gap:4px;justify-content:start;align-content:start}
.dheat b{border-radius:3px;background:#1C1C1C;transition:transform .12s}
.dheat b:hover{transform:scale(1.25)}
.dheat b.fut{background:repeating-linear-gradient(135deg,#111111,#111111 3px,#191919 3px,#191919 6px);opacity:.5}
.heat b{border-radius:2px;background:#1C1C1C;transition:transform .12s}
.heat b:hover{transform:scale(1.35)}
.heat b.mx{box-shadow:0 0 0 1px var(--vio)}
.heat b.fut{background:repeating-linear-gradient(135deg,#111111,#111111 2px,#191919 2px,#191919 4px);opacity:.5}
.hlab{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:7px}
/* dashboard Activity (owner 2026-09-06): seven-column card, the hour grid
 * fills the body so the card matches Flow; date axis left, day totals right */
.act-wide{display:flex;flex-direction:column}
.act-wide .pb{display:flex;flex-direction:column;flex:1}
.act-wide .ph .r{font-size:11px}
/* owner 2026-09-06: no per-day totals column on the right; the 24 hour cells
 * take the whole width after the date axis */
.heat.heat-wide{height:auto;flex:1;min-height:240px;grid-template-columns:auto repeat(24,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:3px 4px}
.heat-wide .hd,.heat-wide .hx{font-family:var(--mono);font-style:normal;font-size:11px;color:var(--dim);line-height:1;white-space:nowrap}
.heat-wide .hd{align-self:center;padding-right:12px}
.heat-wide .hx{align-self:start;padding-top:7px}
.heat-wide .hx.rt{text-align:right}
#scat .sdot{transition:r .15s;cursor:pointer}
#scat .sdot:hover{r:8}
#vol90 .hit,#chg30 .hit,#ct90 .hit,#rq90 .hit,#lat .hit{cursor:crosshair}

/* facts */
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 18px;margin-top:16px}
.facts .f .l{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);font-weight:500;white-space:nowrap}
.facts .f .v{font-family:var(--mono);font-size:11.5px;color:#D4D4D4;margin-top:3px}

/* model cards */
.mgroup{margin-top:24px}
.mgroup h2{font-weight:600;font-size:16px;letter-spacing:-.015em}
.mgroup h2 span{font-family:var(--mono);font-weight:400;font-size:10px;color:var(--dim);margin-left:10px;letter-spacing:.03em}
.modelgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:12px}
.mcard{display:flex;gap:15px;padding:15px;align-items:stretch}
/* clickable model surfaces read as clickable (owner 2026-08-09) */
.panel.lift.mcard,.mcard{cursor:pointer}
.plate{width:96px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(120% 90% at 50% 32%,color-mix(in srgb,var(--c) 15%,var(--panel)),color-mix(in srgb,var(--c) 5%,var(--panel)) 78%);
  box-shadow:inset 0 2px 9px rgba(0,0,0,.38),inset 0 0 0 1px color-mix(in srgb,var(--c) 16%,transparent)}
.plate svg{width:64px;height:64px}
.mcard .body{min-width:0;flex:1;display:flex;flex-direction:column}
.mcard .mname{font-family:var(--mono);font-weight:500;font-size:14px;letter-spacing:-.01em;color:var(--ink);
  display:flex;align-items:center;gap:7px}
.mcard .mname i{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
.mcard .prov{font-size:10px;color:var(--dim);margin-top:1px;font-family:var(--mono)}
.mcard .blurb{font-size:11.5px;line-height:1.5;color:var(--sec);margin-top:6px}
.mcard .foot{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:auto;padding-top:10px}
.mcard .nums{font-family:var(--mono);font-size:10.5px;color:var(--sec);line-height:1.7;white-space:nowrap}
.mcard .nums b{color:var(--faint);font-weight:400;margin-right:5px}
.mcard .sparkbox{display:flex;align-items:center;gap:8px;min-width:0;flex:0 1 auto}
.mcard .sparkbox svg{flex:0 1 auto;min-width:0;max-width:100%;height:auto}
.delta{font-family:var(--mono);font-size:10.5px;flex:none}

/* keys */
.mintform{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:13px 14px;border:1px solid var(--line2);border-radius:0;margin-bottom:14px;background:rgba(29,29,29,.35)}
.inp{background:#0C0C0C;border:1px solid var(--line);border-radius:9px;padding:7px 11px;color:var(--ink);
  font-family:var(--mono);font-size:11.5px;min-width:0;transition:border-color .18s}
.inp:hover{border-color:#555555}
.inp:focus{outline:none;border-color:#555555}
.inp:focus-visible{outline:1px solid var(--focus);outline-offset:1px}
/* custom number steppers (owner 2026-08-09): the native white spin buttons
 * clash with the dashboard — hide them and render brown/gold steppers */
input[type=number]{-webkit-appearance:textfield;-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.spinner{display:inline-flex;flex-direction:column;gap:2px;flex:none;align-self:center}
.spinner button{width:18px;height:11px;border-radius:4px;border:1px solid var(--line);background:var(--raise);color:var(--gold);
  font-size:6.5px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;
  transition:border-color .15s,color .15s,background-color .15s}
.spinner button:hover{border-color:color-mix(in srgb,var(--gold) 55%,var(--line));color:#FFFFFF;background:#222222}
.spinner button:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.spinner button:active{transform:translateY(.5px)}
/* dropdowns in dashboard clothes: dark panel, white text, light grey chevron */
select.inp{-webkit-appearance:none;appearance:none;color-scheme:dark;cursor:pointer;padding-right:26px;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='8' height='5' viewBox='0 0 8 5'%3E%3Cpath d='M1 1l3 3 3-3' fill='none' stroke='%23D0D0D0' stroke-width='1.3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 10px center}
select.inp option{background:#121212;color:var(--ink)}
input[type=date].inp{color-scheme:dark}
/* meters left-align even when the number beside them varies in width */
.bar-cell .readout{display:inline-block;min-width:42px;text-align:right}
/* catalog rows sit at ONE height whether the cell holds a spark or a dash */
table.catrows td{height:39px;padding-top:0;padding-bottom:0;vertical-align:middle}
table.catrows td svg{vertical-align:middle}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--radius-control);padding:2px;background:#0C0C0C}
.seg button{padding:4px 12px;border-radius:var(--radius-control);font-family:var(--mono);font-size:10.5px;color:var(--dim);transition:color .15s,background-color .15s}
.seg button:hover{color:var(--ink)}
.seg button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.seg button.on{color:var(--ink);background:#222222}
.tokbox{border:1px solid rgba(127,176,105,.4);background:rgba(127,176,105,.07);border-radius:10px;padding:13px 15px;margin-bottom:14px}
.tokbox .tl{font-size:12px;font-weight:600;color:var(--ink)}
.tokbox .tk{display:flex;align-items:center;gap:10px;margin-top:9px;flex-wrap:wrap}
.tokbox code{font-family:var(--mono);font-size:11.5px;color:#CFE3BF;background:#111111;border:1px solid var(--line2);border-radius:6px;padding:7px 11px;
  overflow-x:auto;max-width:100%;white-space:nowrap}
.tokbox .note{font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:8px}
/* BYOK add form (real/bridge only) */
.byokform{padding:14px 15px;border:1px solid var(--line2);border-radius:var(--radius-control);margin-bottom:14px;background:rgba(29,29,29,.35)}
.byokform .brow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.byokform .brow:last-of-type{margin-bottom:0}
.byokform .brow .inp{flex:1}
.byokform .bnote{font-family:var(--mono);font-size:10px;line-height:1.6;color:var(--faint);margin-top:11px}
.byokform .berr{font-family:var(--mono);font-size:10.5px;color:var(--dn);margin-top:10px;line-height:1.5}
/* Settings (owner 2026-09-06): no coloured top rule on any Settings box, clear
 * air BETWEEN boxes and none inside them; a red Remove card; the provider
 * connect modal; the centred delete-account confirm column. Scoped to the
 * settings view so no other view's panels change. */
body[data-console-view="settings"] .panel:hover{border-color:var(--line)}
body[data-console-view="settings"] .company-area{margin-bottom:0}
body[data-console-view="settings"] .grid{row-gap:28px}
body[data-console-view="settings"] .settings-row{padding:9px 0}
body[data-console-view="settings"] .settings-links{margin-top:var(--space-2);padding-top:var(--space-2)}
body[data-console-view="settings"] .provider-connection{padding:var(--space-5) var(--space-4);min-height:88px}
.funds-dialog.connect-dialog{width:min(37rem,calc(100% - var(--space-6)));padding:0}
.funds-dialog.connect-dialog .cd-head{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-4) var(--space-5);border-bottom:1px solid var(--line2)}
.funds-dialog.connect-dialog .cd-head .provider-symbol{width:38px;height:38px;border:1px solid var(--line);color:var(--hue,var(--sec));background:var(--ground)}
.funds-dialog.connect-dialog .cd-name{font-size:var(--text-body);font-weight:500;color:var(--ink)}
.funds-dialog.connect-dialog .cd-status{display:flex;align-items:center;gap:6px;font-size:var(--text-label);color:var(--dim);margin-top:2px}
.funds-dialog.connect-dialog .cd-status i{width:7px;height:7px;flex:none;border:1px solid var(--hue,var(--line))}
.funds-dialog.connect-dialog .cd-status.is-on{color:var(--hue)}.funds-dialog.connect-dialog .cd-status.is-on i{background:var(--hue)}
.funds-dialog.connect-dialog .cd-close{margin-left:auto;padding:4px 10px;font-size:15px;line-height:1}
.funds-dialog.connect-dialog .cd-body{padding:var(--space-4) var(--space-5) var(--space-5)}
.funds-dialog.connect-dialog .cd-agent{display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);padding:var(--space-3) var(--space-4);border:1px solid var(--line2);background:var(--raise);border-radius:var(--radius-control);margin-bottom:var(--space-4)}
.funds-dialog.connect-dialog .cd-agent-t{font-size:var(--text-label);font-weight:500;color:var(--ink)}
.funds-dialog.connect-dialog .cd-agent-s{font-size:var(--text-note);color:var(--dim);margin-top:2px}
.funds-dialog.connect-dialog .cd-agent .btn{flex:none;white-space:nowrap}
.funds-dialog.connect-dialog .cd-rows{margin-bottom:var(--space-3);border-bottom:1px solid var(--line2)}
.funds-dialog.connect-dialog .byokform{border:0;padding:0;background:none;margin:0}
.funds-dialog.connect-dialog .byokform .brow{margin-bottom:var(--space-3)}
.funds-dialog.connect-dialog .byokform .brow:last-of-type{margin-bottom:0}
.funds-dialog.connect-dialog .inp{min-height:var(--row-control)}
.funds-dialog.connect-dialog .byok-ok{margin-bottom:var(--space-3)}
/* Mint API key dialog (owner 2026-09-06): the inline mint form became a modal
 * after the Bring-your-own-key Connect pattern; a key mark sits by the title */
.mint-dialog .cd-head .provider-symbol{color:var(--sec)}
.mint-dialog .cd-status{white-space:nowrap}
/* owner 2026-09-06: no status dot beside "Personal key · billed to your
 * account"; the corner × is red like the one destructive act it is */
.mint-dialog .cd-status i{display:none}
.mint-dialog .cd-close{color:var(--dn);border-color:rgba(208,135,112,.45)}
.mint-dialog .cd-close:hover{color:#E8A891;border-color:rgba(208,135,112,.8);background:rgba(208,135,112,.08)}
.mint-dialog .cd-close:disabled{opacity:.45;cursor:not-allowed}
/* the For picker lays its list IN FLOW (the absolute list used to overflow the
 * modal, which scrolls, so the wheel moved the dialog and the list at once);
 * the list caps at 200px with its own scroll and the dialog grows instead */
.mint-dialog .member-picker{min-width:0}
.mint-dialog .member-picker summary{color:var(--ink)}
.mint-dialog .member-picker[open] summary{border-color:#555555}
.mint-dialog .member-picker-list{position:static;width:auto;max-width:none;max-height:200px;margin-top:var(--space-1);box-shadow:none;background:#0C0C0C;overscroll-behavior:contain}
.mint-dialog .member-picker-list label{white-space:normal;overflow-wrap:anywhere;border-radius:var(--radius-control)}
.mint-dialog .member-picker-list label:hover{background:var(--raise)}
.mint-dialog .mint-field{display:flex;flex-direction:column;gap:6px;margin-bottom:var(--space-4);min-width:0}
.mint-dialog .mint-field label{display:block;font-size:var(--text-label);color:var(--sec);margin:0}
.mint-dialog .mint-field .inp{width:100%;min-height:var(--row-control);box-sizing:border-box}
.mint-dialog .mint-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:var(--space-5)}
.mint-dialog .mint-money{display:flex;align-items:center;gap:8px}.mint-dialog .mint-money .readout{color:var(--dim)}.mint-dialog .mint-money .inp{text-align:left}
.mint-dialog .mint-exp{display:flex;gap:8px}.mint-dialog .mint-exp .inp{flex:1;min-width:0}
.mint-dialog .mint-bill{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.mint-dialog .mint-bill .inp{flex:1;width:auto}
.mint-dialog .member-picker summary{min-height:var(--row-control);display:flex;align-items:center;box-sizing:border-box;background:#0C0C0C;font-size:var(--text-label)}
.mint-dialog .member-picker summary::after{float:none;margin-left:auto;padding-left:var(--space-3)}
.mint-dialog .berr{font-family:var(--mono);font-size:10.5px;color:var(--dn);line-height:1.5;margin:0 0 var(--space-3)}
/* last row (owner 2026-09-06 r4): Cap, a short Expires select, and the Mint
 * key button to its right on the same line; no footer band below the fields */
.mint-dialog .mint-row.mint-last{grid-template-columns:minmax(0,1fr) 150px auto;gap:var(--space-4);align-items:start}
.mint-dialog .mint-row.mint-last .mint-field{margin-bottom:0}
.mint-dialog .mint-row.mint-last .mint-exp{flex-wrap:wrap}
.mint-dialog .mint-row.mint-last .mint-exp #mint-exp-date{flex:1 1 100%}
.mint-dialog .mint-act{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.mint-dialog .mint-act .mint-lab{display:block;font-size:var(--text-label);visibility:hidden}
.mint-dialog .mint-act .mint-go{min-height:var(--row-control);height:var(--row-control);padding-top:0;padding-bottom:0;box-sizing:border-box;white-space:nowrap}
.mint-dialog .mint-go{border-color:rgba(127,176,105,.5);color:#9CC487}
.mint-dialog .mint-token{display:flex;align-items:center;gap:10px;margin-bottom:var(--space-3)}
.mint-dialog .mint-token code{flex:1;min-width:0;font-family:var(--mono);font-size:12px;color:#CFE3BF;background:#111111;border:1px solid var(--line2);border-radius:var(--radius-control);padding:10px 12px;overflow-wrap:anywhere;word-break:break-all;user-select:all}
.mint-dialog .mint-token .btn{flex:none}
.mint-dialog .mint-once{font-size:var(--text-label);color:var(--sec);line-height:1.5;margin:0}
.mint-dialog .mint-once+.mint-once{margin-top:var(--space-1)}
.mint-dialog:focus-visible{outline:none}
.da-center{display:flex;flex-direction:column;align-items:center;text-align:center;gap:var(--space-3);max-width:36em;margin:0 auto}
.da-center .da-text{flex:none}.da-center .da-list{text-align:left}.da-center .da-actions{margin-left:0}
.da-center .da-pass{width:100%;max-width:24em;min-height:var(--row-control)}
.btn.da-btn:disabled{opacity:.45;cursor:not-allowed}
.byok-ok{border:1px solid rgba(127,176,105,.4);background:rgba(127,176,105,.07);border-radius:11px;padding:13px 15px;margin-bottom:14px}
.byok-ok .tl{font-size:12px;font-weight:600;color:var(--ink)}
.byok-ok .cov{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.byok-ok .rc{font-family:var(--mono);font-size:10px;line-height:1.6;color:var(--dim);margin-top:10px}

/* billing editor */
.sw{position:relative;width:38px;height:21px;border-radius:var(--radius-control);background:#292929;border:1px solid var(--line);flex:none;
  transition:background-color .18s,border-color .18s}
.sw i{position:absolute;left:2px;top:2px;width:15px;height:15px;border-radius:50%;background:#8A7E6C;
  transition:transform .18s,background-color .18s}
.sw:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sw.on{background:rgba(127,176,105,.22);border-color:rgba(127,176,105,.5)}
.sw.on i{transform:translateX(16px);background:var(--up)}
.arrow-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.arlab{font-size:11px;color:var(--sec)}
.flash{font-family:var(--mono);font-size:10.5px;color:var(--up);opacity:0;transition:opacity .3s}
.flash.show{opacity:1}

/* misc */
.policy{display:flex;flex-direction:column;gap:8px}
.policy .p{display:flex;align-items:center;gap:12px;padding:10px 13px;border:1px solid var(--line2);border-radius:10px;transition:border-color .18s}
.policy .p.on{border-color:rgba(208,208,208,.5);background:rgba(255,255,255,.04)}
.policy .p .nm{width:78px;flex:none;font-size:12px;color:var(--sec)}
.policy .p.on .nm{color:var(--ink)}
.policy .p .meter{flex:1}
.policy .p .pc{width:36px;text-align:right;font-family:var(--mono);font-size:10.5px;color:var(--dim);flex:none}
.chain{display:flex;flex-direction:column}
.chain .st{display:flex;gap:13px;position:relative;padding:10px 0}
.chain .st .k{width:23px;height:23px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:10.5px;color:var(--sec);flex:none;background:var(--raise);z-index:1}
.chain .st:not(:last-child)::before{content:'';position:absolute;left:11px;top:35px;bottom:-8px;width:1px;background:var(--line2)}
.chain .st .tg{font-size:12.5px;color:var(--ink)}
.chain .st .rl{font-size:11px;color:var(--dim);margin-top:2px}
.shbar{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px}
.shbar b{height:100%;transition:opacity .15s}
.shbar b:hover{opacity:.8}
.bigmeter{position:relative;height:10px;border-radius:5px;background:#292929;margin-top:18px}
.bigmeter b{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.bigmeter i{position:absolute;top:-4px;bottom:-4px;width:1px;background:var(--cld);opacity:.9}
.hbs{display:flex;flex-direction:column;gap:12px}
.mover{display:grid;grid-template-columns:minmax(150px,190px) 84px 1fr 62px;align-items:center;gap:14px;font-size:12px}
.mover .nm{min-width:0}
.mover .nm .sub{display:block;font-size:10px;color:var(--dim);margin-top:1px;font-family:var(--mono)}
.mover .cost{font-family:var(--mono);font-size:12px;color:var(--ink);text-align:right}
.mover .dl{text-align:right}
.emptystate{padding:60px 24px;text-align:center;color:var(--dim);font-size:12.5px}
.emptystate .big-ico{margin:0 auto 18px;width:44px;color:#555555}
.quiet-empty{padding:16px 2px 4px;font-family:var(--mono);font-size:11px;color:var(--dim)}
.quiet-empty.is-blank{min-height:35px;box-sizing:border-box}
.showmore-wrap{display:flex;justify-content:center;padding:8px 0 14px}
.showmore{font-family:var(--mono);font-size:10.5px;letter-spacing:.02em;color:var(--sec);background:rgba(29,29,29,.5);
  border:1px solid var(--line);border-radius:var(--radius-control);padding:5px 15px;cursor:pointer;
  transition:border-color .18s,background-color .18s,color .18s}
.showmore:hover{color:var(--ink);border-color:#555555;background:var(--raise)}
.showmore:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.showmore:active{transform:translateY(1px)}

@media (max-width:1240px){
  .modelgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .plate{width:74px}.plate svg{width:54px;height:54px}
}
@media (max-width:1200px){
  .sp5,.sp4h{grid-column:span 12 !important}
}
@media (max-width:1150px){
  .mcard{flex-direction:column}.mcard .plate{width:100%;height:76px}
  .money{font-size:40px}
}
@media (max-width:980px){
  .shell{grid-template-columns:64px minmax(0,1fr)}
  .rail{padding:20px 10px 14px}
  .rail .word,.rail .grp,.railfoot,.proj{display:none}
  .brand .bar{display:none}
  .nav a span{display:none}
  .modelgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
/* narrow screens (QA 2026-09-02): the top bar wraps instead of pushing the
 * page wide; tables scroll inside their panel; the 12-col grid collapses. */
@media (max-width:820px){
  .main{padding:18px 16px 64px}
  .topact{flex-wrap:wrap;flex:1 1 100%;row-gap:8px}
  .grid{gap:12px}
  .grid>*{grid-column:span 12 !important}
  .pb{overflow-x:auto}
  /* panel headers: the right slot (chips, buttons) drops under the title
   * instead of being clipped mid-word at its nowrap edge (390px QA 2026-09-04) */
  .ph{flex-wrap:wrap;row-gap:6px}
  .ph .r{white-space:normal;overflow:visible;text-overflow:clip;text-align:left;flex:1 1 100%;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .facts{grid-template-columns:1fr}
  .modelgrid{grid-template-columns:1fr}
  .money{font-size:32px}
}
@media (max-width:480px){
  .shell{grid-template-columns:52px minmax(0,1fr)}
  .rail{padding:14px 6px 10px}
  .main{padding:14px 10px 56px}
  .scope{border-radius:16px}
  .scope button{padding:5px 9px;font-size:11px}
  .top h1{font-size:18px}
}
@media (max-width:820px),(pointer:coarse){
  .company-area .btn,.company-area .inp,[data-pv-retry]{min-height:var(--touch-target);min-width:var(--touch-target)}
}
@media (prefers-reduced-motion:reduce){
  .in{animation:none}
  .panel,.panel:hover,.panel.lift:hover{transform:none}
  *{transition-duration:.01ms !important}
}
/* Console review: shared control geometry and readable black surfaces. */
:root{
  color-scheme:dark;
  --ground:#090909;--panel:#121212;--raise:#1B1B1B;--line:#303030;--line2:#252525;
  --ink:#F4F4F4;--sec:#D0D0D0;--dim:#ADADAD;--faint:#959595;
  --grid:rgba(255,255,255,.07);--plate:var(--panel);--sticker-cut:var(--panel);
  --radius-control:7px;--radius-tag:5px;--radius-panel:12px;
  --text-body:14px;--text-label:12px;--text-note:11px;--text-title:16px;--text-table:13px;--text-value:24px;--row-control:32px;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;
}
body{font-size:var(--text-body)}
.rail{background:var(--panel);overflow:visible}
.brand{padding-bottom:var(--space-6)}
.brand .mark{color:var(--ink)}
.nav{min-height:0;overflow-y:auto;overscroll-behavior:contain}
.nav a{min-height:var(--touch-target);font-size:var(--text-body);border-radius:var(--radius-control)}
.nav .nav-divider{margin:var(--space-3) var(--space-2);border-top:1px solid var(--line2)}
.nav a[data-anchor]{margin-left:var(--space-3);font-size:var(--text-label)}
.railfoot{position:relative;background:var(--panel);flex:none}
.acct{padding:var(--space-2) 0;width:100%;text-align:left;border-radius:var(--radius-control)}
.acct:focus-visible{outline:2px solid var(--focus);outline-offset:var(--space-1)}
.acct .who{flex:1;overflow:hidden}.acct .who .em{font-size:var(--text-label);color:var(--sec)}

var AF_STOPS=[5,10,25,50,100,250,500];

function wireAddFunds(){
  var range=document.getElementById('af-range'),amount=document.getElementById('af-am');if(!range||!amount)return;
  var read=document.getElementById('af-read'),go=document.getElementById('af-go'),hint=document.getElementById('af-hint');

  var paint=function(n){
    var idx=afStopIndex(n);
    range.value=String(idx);range.style.setProperty('--p',(idx/(AF_STOPS.length-1)*100).toFixed(2)+'%');range.setAttribute('aria-valuetext','$'+AF_STOPS[idx]);
    stops.forEach(function(s){s.classList.toggle('on',Number(s.dataset.afStop)===n)});
    if(read)read.innerHTML=usdSign(afReadout(n));
    if(go&&!state.afBusy)go.textContent=afGoLabel(n);
    if(hint)hint.textContent=amount.value.trim()===''?'':n<5?'Enter at least $5.':n>250000?'Maximum $250,000.':'';
  };
  var set=function(v){amount.value=v;state.afAmount=v===''?null:v;paint(afNum(v))};
  range.addEventListener('input',function(){set(String(AF_STOPS[Number(range.value)]||AF_STOPS[0]))});

}

function runAddFundsCheckout(){
  if(state.afBusy)return;
  var amEl=document.getElementById('af-am'),parsed=capParse(amEl?amEl.value:'');

    render(false);return;
  }
  state.afBusy=true;
  state.payMsg={kind:'ok',text:'opening stripe checkout. Confirm the payment there.'};
  render(false);
  return window.HW_REAL.topUpCheckout(parsed.nano).then(function(url){
    window.location.assign(url);
  }).catch(function(err){
    if(!err||err.status!==409)throw err;
    return window.HW_REAL.enroll({firstChargeNanodollars:parsed.nano}).then(function(result){
      if(result.alreadyEnrolled)throw new Error('Payment details changed. Refresh and retry.');

    state.afBusy=false;
    state.payMsg={kind:'err',text:String(err&&err.message||err)};
    render(false);
  });

/* red dash — the honesty mark (owner rule 2026-08-03): a number with no live

var RD=window.redDash||function(reason){return '<span style="color:var(--dn)" title="'+e(reason||'no data pipeline for this number yet')+'">—</span>'};

/* owner 2026-09-06: the serif figures on Payment keep Newsreader digits but
 * the currency sign is the console's normal sans "$" (Newsreader's is a tall
 * scriptural glyph). Only a leading "$" is wrapped; RD() placeholders pass. */

function fInt(v,r){return v==null?RD(r):F.int(v)}
/* owner 2026-09-07: a headline figure ("$9,016.42" ran off its panel at 1440)
 * drops the cents from $1,000 up and carries the exact value in its title;
 * fitMoney() then shrinks any .money that still would not fit. sign=true
 * gives the sans "$" the Balance panel uses (usdSign). */
function moneyHead(v,r,sign){
  if(v==null)return RD(r);

/* owner 2026-09-07: no money headline runs past its panel. After every paint
 * each .money is measured against its panel body and its font shrinks in 2px
 * steps (floor 16px) until the figure fits; only at the floor may it wrap.
 * The inline size an element started with is kept on it so a resize can
 * measure from the top again. */
function fitMoney(root){
  var list=(root||document).querySelectorAll('.money');
  Array.prototype.forEach.call(list,function(el){
    if(el.dataset.fitBase==null)el.dataset.fitBase=el.style.fontSize||'';
    el.style.fontSize=el.dataset.fitBase;el.style.whiteSpace='';
    var box=el.closest('.pb')||el.parentElement;if(!box)return;
    var cs=getComputedStyle(box),avail=box.clientWidth-(parseFloat(cs.paddingLeft)||0)-(parseFloat(cs.paddingRight)||0);
    if(!(avail>0))return;
    var size=parseFloat(getComputedStyle(el).fontSize)||0,n=0;
    while(n++<24&&size>16&&moneyWidth(el)>avail+0.5){size=Math.max(16,size-2);el.style.fontSize=size+'px'}
    if(moneyWidth(el)>avail+0.5)el.style.whiteSpace='normal';
  });
}
function moneyWidth(el){var r=document.createRange();r.selectNodeContents(el);return r.getBoundingClientRect().width}
var fitMoneyTimer=0;

/* owner 2026-08-08 declutter: the visible empty state is ONE short phrase;
 * the full reason (route, build, contract note) lives on hover — honesty by
 * tooltip, not by a wall of mono subtext under every panel. */
function shortReason(reason){
  var r=String(reason||'');
  if(/404|401|403|unavailable|unreachable|not deployed|no .*source|never enters|never leaves/i.test(r))return 'no data source yet · hover for detail';
  if(/no recorded|no measured|no traffic|empty|no .*this window|yet/i.test(r))return 'nothing recorded in this window';
  return r.length>64?r.slice(0,61)+'…':r;

/* owner 2026-09-07 (round 14): a BLANK account — nothing recorded in any

function blankAccount(sc){sc=sc||S();return !!(sc&&sc.totals&&sc.totals.requests===0&&daysEmpty(sc.days||[]))}

/* ================= MODELSPEC: model-list curation (real/bridge only) =================
 * The owner's rule: the catalog was an information overload — cut every model
 * surface to a curated 10-15, hide the rest under "Show more (+N)". Fill order:
 *   (0) every installed LOCAL model (bridge registry) — always shown,
 *   (1) every BYOK-covered model (registered, enabled byok suites),
 *   (2) the most-used cloud/managed models by THIS scope's usage (requests, then
 *       tokens). Never pad an unused model ahead of a used one.
 * Totals/venue-splits never change — only which rows render. */
function usageRank(a,b,uOf){
  var ua=uOf(a),ub=uOf(b);
  if((ub.req||0)!==(ua.req||0))return (ub.req||0)-(ua.req||0);
  return (ub.tok||0)-(ua.tok||0);
}
function modelTier(id){
  var li=(D&&D.localInstalled)||{},bk=(D&&D.byokModels)||{},m=MODEL[id]||{};
  if(li[id]||m.installed||m.kind==='local')return 0;
  if(bk[id])return 1;
  return 2;
}
/* rank a list of catalog rows (objects with .id) by tier then this-scope usage */
function rankModels(list,useBy){
  var uOf=function(m){var u=useBy&&useBy[m.id];return u?{req:u.req||0,tok:(u.tin||0)+(u.tout||0)}:{req:0,tok:0}};
  return list.slice().sort(function(a,b){
    var ta=modelTier(a.id),tb=modelTier(b.id);
    if(ta!==tb)return ta-tb;
    return usageRank(a,b,uOf);
  });
}
/* rank a list of USAGE rows (objects with .id/.req/.tin/.tout) — for the network
 * per-model tables whose rows are usage, not catalog rows */
function rankUsageRows(rows){
  var uOf=function(r){return {req:r.req||0,tok:(r.tin||0)+(r.tout||0)}};
  return rows.slice().sort(function(a,b){
    var ta=modelTier(a.id),tb=modelTier(b.id);
    if(ta!==tb)return ta-tb;

/* curate + apply the per-surface open/closed state. rankFn returns the ranked

function curate(ranked,key,n){

/* project hue (owner 2026-09-05): one colour per project everywhere — the
 * Keys view groups, the Company scope Projects rows and its Company keys
 * groups. Deterministic per project id (string hash into an eight-hue
 * palette); a collision moves to the next free hue so a handful of projects
 * never share one. */
var PROJ_HUES=[['#B48CE8',275],['#6FC2B4',170],['#D68FB8',325],['#7FB069',100],['#D08770',20],['#7A9CD6',220],['#9B8CD9',255],['#E2D46A',55]];
var PROJ_HUE_OF={};
function projHue(id){
  if(!id)return 'var(--dim)';
  id=String(id);
  if(PROJ_HUE_OF[id])return PROJ_HUE_OF[id];
  var h=0;for(var i=0;i<id.length;i++)h=(h*31+id.charCodeAt(i))>>>0;
  var usedAng=[],usedHex={};for(var k in PROJ_HUE_OF){usedHex[PROJ_HUE_OF[k]]=1;PROJ_HUES.forEach(function(p){if(p[0]===PROJ_HUE_OF[k])usedAng.push(p[1])})}
  var n=PROJ_HUES.length,pick=PROJ_HUES[h%n][0];
  if(usedAng.length&&usedAng.length<n){
    /* second project onward: the free hue farthest (on the wheel) from every
     * hue already given out, so neighbours never read as the same family;
     * ties fall to the hash's own preference */
    var best=-1;
    for(var j=0;j<n;j++){

      if(d>best){best=d;pick=p[0]}
    }
  }
  PROJ_HUE_OF[id]=pick;return pick;
}

/* the inline mark for one provider id, or '' when the map has none (callers
 * then fall back to the /models catalog's providerMark, never to initials) */
function providerMarkSvg(id,size){
  var body=PROVIDER_MARK[String(id||'').toLowerCase()];if(!body)return '';
  size=size||22;
  return '<svg viewBox="0 0 24 24" width="'+size+'" height="'+size+'" fill="currentColor" fill-rule="evenodd" aria-hidden="true" focusable="false">'+body+'</svg>';
}
function providerKeyName(provider,label){
  var id=String(provider||'').toLowerCase().split(/[ :]/)[0];
  var mark=providerMarkSvg(id,22)||(window.HW_MODELS&&window.HW_MODELS.providerMark?window.HW_MODELS.providerMark(id):'');
  return '<span class="settings-provider"><span class="provider-symbol" aria-hidden="true">'+(mark||e((label||CLOUD_PROVIDER_LABEL[id]||id).slice(0,1)))+'</span><span>'+e(label||CLOUD_PROVIDER_LABEL[id]||provider)+'</span></span>';
}
/* the gateway-custody connect form for ONE provider, inside the connect modal.
 * Same save contract as before: #byok-form[data-lane=cloud], #byok-prov (a
 * hidden, pre-selected select so the wire() add handler reads the provider),
 * #byok-key, #byok-az-url for azure, #byok-add -> HW_REAL.byokCloudAdd. */
function byokConnectForm(provider,replacing){
  /* replacing: a saved key exists, so the button reads Replace key (same PUT) */
  var okBox='';
  if(state.byokResult&&state.byokResult.cloud&&state.byokResult.provider===provider){
    okBox='<div class="byok-ok" id="byok-ok"><div class="tl">Added '+e(CLOUD_PROVIDER_LABEL[provider]||provider)+'</div></div>';
  }
  var az=provider==='azure';
  return okBox+'<div class="byokform" id="byok-form" data-lane="cloud">'+
    '<select class="inp" id="byok-prov" aria-label="provider" style="display:none" tabindex="-1"><option value="'+e(provider)+'" selected>'+e(CLOUD_PROVIDER_LABEL[provider]||provider)+'</option></select>'+
    '<div class="brow"><input class="inp" id="byok-key" type="password" placeholder="API key" aria-label="API key" autocomplete="off" spellcheck="false"'+(state.byokBusy?' disabled':'')+'></div>'+
    /* azure is the one provider whose PUT body must also carry the resource
     * base_url (the gateway refuses the field on every other provider);
     * deployments are not mapped, the caller uses deployment names as the model */
    '<div id="byok-az" style="display:'+(az?'':'none')+'">'+
      '<div class="brow"><input class="inp" id="byok-az-url" placeholder="https://{resource}.openai.azure.com/openai/v1" autocomplete="off" spellcheck="false" aria-label="Azure resource URL"></div>'+
      '<p class="note" style="margin-bottom:var(--space-3)">Enter your Azure resource URL. Use the deployment name as the model.</p>'+
    '</div>'+
    (state.byokErr?'<div class="berr" role="alert" style="margin:0 0 var(--space-3)">'+e(state.byokErr)+'</div>':'')+
    '<div class="brow"><button class="btn" id="byok-add"'+(state.byokBusy?' disabled':'')+'>'+(state.byokBusy?(replacing?'Replacing…':'Connecting…'):replacing?'Replace key':'Connect')+'</button></div>'+
  '</div>';
}
/* the connect MODAL (owner 2026-09-06, after the Experiential Labs pattern): a
 * centred dialog with the provider's mark, name and connection status, a close
 * X; the "Connect from your coding agent" row with Copy prompt; one API key
 * field; a Connect button. Opened by wireSettings (showModal) whenever
 * state.connectProvider is set; closing clears it. */
function providerConnectDialog(cloudK,localK){
  var provider=state.connectProvider;if(!provider)return '';
  var label=CLOUD_PROVIDER_LABEL[provider]||provider,hue=providerHue(provider);
  var c=cloudK.find(function(k){return k.provider===provider});
  var l=localK.find(function(k){return k.provider===provider||String(k.name).toLowerCase()===provider});
  var connected=!!(c||(l&&l.enabled!==false));
  /* plain "Connected" (owner 2026-09-06: no "· ····0000"); the saved key's
   * last4 stays on the Remove key row below */
  var status=c?'Connected':(l&&l.enabled!==false)?'Connected on this machine':'Not connected';
  var id=String(provider).toLowerCase().split(/[ :]/)[0];
  var mark=providerMarkSvg(id,24)||(window.HW_MODELS&&window.HW_MODELS.providerMark?window.HW_MODELS.providerMark(id):'');
  /* the agent prompt is the real gateway-custody flow (owner 2026-09-06: "make
   * sure the copy prompt is actually real"): `conifer keys add <provider>` reads
   * the key from stdin and PUTs /v1/keys/<provider> with the account's
   * entitlement bearer and {api_key} (azure adds base_url), exactly what
   * HW_REAL.byokCloudAdd sends from this dialog. Verified against
   * `conifer keys add --help` on the installed CLI. */
  var az=provider==='azure';
  var addCmd=az?'printf %s "$KEY" | conifer keys add azure --url https://{resource}.openai.azure.com/openai/v1':'printf %s "$KEY" | conifer keys add '+provider;
  var prompt='Connect my '+label+' API key to Conifer so '+label+' models run on my own '+label+' account through the Conifer gateway.\n\n'+
    '1. Run `conifer login --status`. If the Conifer CLI is not installed, set it up from the Conifer docs (conifer.build/docs) first. If it is installed but not signed in, run `conifer login` and let me finish the sign-in.\n'+
    '2. Ask me for my '+label+' API key. Never print it, log it, or write it to a file. If I do not have one, help me create one in my '+label+' account.\n'+

 * writes through it. The static ?demo=1 keeps a localStorage seed. */
var OL={org:null,loaded:false,projects:null,budgets:null,enf:null,at:0,pending:false,err:null,seq:0};
function pvPrefsMode(){return !!(REAL&&window.HW_REAL&&window.HW_REAL.orgLimitsLive)}
function olSync(orgId,force){
  if(!pvPrefsMode()||!orgId)return;
  if(OL.org!==orgId)OL={org:orgId,loaded:false,projects:null,budgets:null,enf:null,at:0,pending:false,err:null,seq:0};
  if(OL.pending)return;
  if(!force&&OL.loaded&&Date.now()-OL.at<10000)return;
  OL.pending=true;
  var target=OL,seq=++OL.seq;
  window.HW_REAL.orgLimits(orgId).then(function(j){
    if(OL!==target||OL.seq!==seq)return;
    var changed=!!OL.err||JSON.stringify(j)!==JSON.stringify({projects:OL.projects,budgets:OL.budgets,enforcement:OL.enf,org_id:OL.org,ordinary_hold_nanodollars:j.ordinary_hold_nanodollars});
    olAdopt(j);
    if(changed&&state.scope==='company')render(false);
  }).catch(function(err){if(OL!==target||OL.seq!==seq)return;OL.pending=false;OL.at=Date.now();OL.err=String(err&&err.message||err);if(state.scope==='company')render(false)});
}
function olAdopt(j){
  if(!j)return;
  if(j.projects)OL.projects=j.projects;
  if(j.budgets)OL.budgets=j.budgets;
  OL.enf=j.enforcement||null;
  if(j.enforcement&&j.enforcement.gateway_ok&&OL.lastErr&&OL.lastErr.saved)OL.lastErr=null;
  OL.loaded=true;OL.at=Date.now();OL.pending=false;OL.err=null;
}
function olWrite(promise){
  var target=OL,orgId=OL.org,seq=++OL.seq;
  OL.pending=true;
  /* the editor that fired this may still be focused; replacing #view while its
   * blur handler runs throws NotFoundError — drop focus first */
  try{if(document.activeElement&&document.activeElement.blur)document.activeElement.blur()}catch(e2){}
  function fail(err){
    if(OL===target&&OL.seq===seq){OL.pending=false;OL.err=String(err&&err.message||err);if(state.scope==='company')render(false)}
    throw err;
  }
  function refresh(j,err){
    if(OL===target&&OL.seq===seq&&Object.prototype.hasOwnProperty.call(j,'enforcement'))OL.enf=j.enforcement;
    return window.HW_REAL.orgLimits(orgId).then(function(full){
      var pending=!(full.enforcement&&full.enforcement.gateway_ok===true);
      if(OL===target&&OL.seq===seq){olAdopt(full);if(state.scope==='company')render(false)}
      if(pending){
        var problem=err||new Error('Saved; sync pending. Retry.');
        problem.saved=true;problem.report=j;throw problem;
      }
      return j;
    },function(readErr){
      var problem=err||readErr;problem.saved=true;problem.report=j;
      return fail(problem);
    });
  }
  /* A failed publication may already have saved the project or budget. Read
   * its desired state and retry only reconciliation, never the mutation. */
  return promise.then(function(j){return refresh(j,null)},function(err){
    return err.saved?refresh(err.report,err):fail(err);
  });
}

/* ================= shell / router ================= */
var ROUTES=['dashboard','usage','models','routing','uptime','keys','billing','limits','docs','settings'];
var TITLES={dashboard:'Dashboard',usage:'Token spend',models:'Models',routing:'Routing',uptime:'Uptime',keys:'API keys',billing:'Payment',limits:'Limits',docs:'Docs',settings:'Settings'};
/* sidebar order MUST mirror the page's top-to-bottom section order — the
 * scroll-spy walks these anchors, and any mismatch makes the highlight jump
 * backwards while scrolling (owner 2026-08-09) */
var NET_TABS=[['n-volume','Token volume','usage'],['n-flow','Flow','routing'],['n-activity','Activity','dashboard'],['n-models','Models','models'],['n-usage','Usage','share'],['n-latency','Latency','limits']];
var CO_TABS=[['c-usage','Members','usage'],['c-projects','Projects','models'],['c-keys','Company keys','keys']];
function anchorNav(tabs){
  return tabs.map(function(t2){
    return '<a href="#/dashboard" data-anchor="'+t2[0]+'" class="'+(state.anchor===t2[0]?'on':'')+'">'+ic(t2[2])+'<span>'+t2[1]+'</span></a>';
  }).join('');
}
function navHtml(){
  var mk=function(v){return '<a title="'+TITLES[v]+'" aria-label="'+TITLES[v]+'" href="#/'+v+'" data-v="'+v+'" class="'+(state.view===v&&state.scope!=='company'?'on':'')+'">'+ic(v)+'<span>'+TITLES[v]+'</span></a>'};
  var links=state.scope==='company'?mk('dashboard')+anchorNav(CO_TABS):['dashboard','usage','models','uptime'].map(mk).join('');
  if(state.scope==='machine')links+=mk('routing');
  return '<div class="nav-primary">'+links+'</div><div class="nav-secondary">'+['keys','billing','docs','settings'].map(mk).join('')+'</div>';
}
/* The sidebar is redrawn on every render. When only the active link changed
 * (a navigation), the existing anchors are kept and just get their new
 * class, so the rail-collapse transition on the labels is not cut short by a
 * fresh DOM (owner 2026-09-06: Docs auto-collapses and must not jump). Any
 * structural change (scope switch, different link set) replaces the nav. */
function paintNav(){
  var el=document.getElementById('nav'),tpl=document.createElement('template');tpl.innerHTML=navHtml();
  var next=tpl.content.querySelectorAll('a'),cur=el.querySelectorAll('a'),same=next.length>0&&next.length===cur.length;
  for(var i=0;same&&i<next.length;i++)same=next[i].getAttribute('href')===cur[i].getAttribute('href')&&next[i].dataset.anchor===cur[i].dataset.anchor&&next[i].dataset.v===cur[i].dataset.v&&next[i].innerHTML===cur[i].innerHTML;
  if(!same){el.innerHTML=tpl.innerHTML;return}
  for(var j=0;j<next.length;j++)if(cur[j].className!==next[j].className)cur[j].className=next[j].className;
}
/* ---- Get started (owner 2026-09-07; rebuilt r13 after Experiential Labs'
 * bottom-right button). A small fixed button, bottom right on EVERY view,
